name: Build & Deploy Documentation

on:
  push:
    branches: [main]
    paths: 
      - 'src_docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src_docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install MkDocs and dependencies
        run: |
          uv pip install --system mkdocs-material mkdocstrings[python]

      - name: Validate MkDocs configuration
        run: |
          cd src_docs
          mkdocs config

      - name: Build documentation
        run: |
          cd src_docs
          mkdocs build --verbose --strict

      - name: Verify build output
        run: |
          ls -la docs/
          test -f docs/index.html || (echo "Documentation build failed - index.html missing" && exit 1)
          test -f docs/.nojekyll || (echo ".nojekyll file missing" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate:
    name: Validate Documentation Links
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Install MkDocs and link checker
        run: |
          uv pip install --system mkdocs-material mkdocstrings[python]

      - name: Download built documentation
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: docs-artifact/

      - name: Extract and serve documentation
        run: |
          cd docs-artifact
          tar -xf artifact.tar
          cd ..
          python -m http.server 8000 --directory docs-artifact &
          sleep 5

      - name: Check documentation links
        run: |
          # Check that main pages are accessible
          curl -f http://localhost:8000/ || (echo "Index page not accessible" && exit 1)
          curl -f http://localhost:8000/installation/ || (echo "Installation page not accessible" && exit 1)
          curl -f http://localhost:8000/quickstart/ || (echo "Quickstart page not accessible" && exit 1)
          echo "Basic link validation passed"