site_name: pyxplod Documentation
site_description: Python Code Exploder - Extract classes and functions into separate files
site_author: Terragon Labs
site_url: https://github.com/twardoch/pyxplod

repo_name: twardoch/pyxplod
repo_url: https://github.com/twardoch/pyxplod

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: md
site_dir: ../docs

nav:
  - Home: index.md
  - Getting Started:
    - Installation & Setup: installation.md
    - Quick Start Guide: quickstart.md
  - Core Concepts:
    - Understanding Explosion: concepts.md
    - Methods & Strategies: methods.md
  - User Guide:
    - Command Line Usage: cli-usage.md
    - Configuration Options: configuration.md
  - Advanced Topics:
    - AST Processing: ast-processing.md
    - File Organization: file-organization.md
  - Reference:
    - API Reference: api-reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/twardoch/pyxplod